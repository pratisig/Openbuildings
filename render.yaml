# Déploiement Render — API PratiSIG.
#
# Render → New → Blueprint → pointer sur ce dépôt.
# Le plan gratuit suffit pour tester ; voir docs/DEPLOIEMENT.md pour les limites.

services:
  - type: web
    name: pratisig-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # Contexte a la racine : l'image doit embarquer data/reference/
    dockerContext: .
    plan: free
    region: frankfurt          # le plus proche de Dakar
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PRATISIG_ENVIRONMENT
        value: production
      - key: PRATISIG_DEBUG
        value: "false"

      # ── Adapté au plan gratuit (512 Mo de RAM) ──────────────────
      # Au-delà, DuckDB se fait tuer par l'OOM killer dès la première
      # requête Overture un peu large.
      - key: PRATISIG_DUCKDB_MEMORY_LIMIT
        value: 300MB
      - key: PRATISIG_DUCKDB_THREADS
        value: "2"

      # Le plan gratuit n'a pas de disque persistant : cache ephemere
      # dans /tmp (reconstruit a chaque deploiement, rien a configurer).
      - key: PRATISIG_CACHE_DIR
        value: /tmp/pratisig-cache

      # ── CORS : autoriser le front ───────────────────────────────
      # Remplacer par l'URL de production une fois le front déployé.
      - key: PRATISIG_CORS_ORIGINS
        value: '["http://localhost:5173"]'
      # Autorise toutes les URL d'aperçu Vercel (elles changent à chaque déploiement)
      - key: PRATISIG_CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'

      # ── Optionnels : à renseigner dans le tableau de bord Render ─
      - key: PRATISIG_GEE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: PRATISIG_GEE_SERVICE_ACCOUNT_KEY_JSON
        sync: false
      - key: PRATISIG_LLM_ENABLED
        value: "false"
      - key: PRATISIG_LLM_API_KEY
        sync: false

# Pas de bloc `disk:` : « disks are not supported for free tier services »
# fait echouer le deploiement avant meme la construction de l'image.
