[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pratisig-api"
version = "1.0.0"
description = "API géospatiale unifiée PratiSIG — Sénégal & Afrique de l'Ouest"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "duckdb>=0.10",
    "shapely>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyogrio>=0.7", "pyarrow>=15.0"]
raster = ["earthengine-api>=0.1.390", "google-auth>=2.28"]
agent = ["litellm>=1.35"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]
all = [
    "geopandas>=0.14", "pyogrio>=0.7", "pyarrow>=15.0",
    "earthengine-api>=0.1.390", "google-auth>=2.28",
    "litellm>=1.35",
]

[tool.setuptools.packages.find]
include = ["pratisig_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
